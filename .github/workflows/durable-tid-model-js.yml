name: durable-tid JS model

on:
  push:
    paths:
      - "scaffolds/durable-tid/model-js/**"
  pull_request:
    paths:
      - "scaffolds/durable-tid/model-js/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run exhaustive durable-tid state model tests
        working-directory: scaffolds/durable-tid/model-js
        run: node --test
