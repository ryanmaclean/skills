name: datadog-cli
base: core22
version: '0.1.0'
summary: Fast, single-binary Datadog CLI written in Go
description: |
  A high-performance Datadog CLI tool written in Go that provides 67x faster
  startup than the Python version (3ms vs 200ms) and 67% less memory usage
  (10MB vs 30MB).

  Features:
  - All 22 commands with full Python parity
  - Zero dependencies - single static binary
  - Fast performance - 67x faster startup (3ms vs 200ms)
  - Low memory - 67% less memory usage (10MB vs 30MB)
  - Context auto-detection from git repositories
  - APM traces, logs, metrics, security and more
  - Works on all major Linux distributions

  To use the CLI after installation, set your Datadog credentials:
    export DD_API_KEY="your_api_key"
    export DD_APP_KEY="your_app_key"

  Get your API keys from:
    https://app.datadoghq.com/organization-settings/api-keys

  Quick start:
    dd context          # Auto-detect service
    dd health           # Check service health
    dd apm              # View APM traces
    dd --help           # Show all commands

  Documentation:
    https://github.com/yourusername/datadog-cli-go

grade: stable
confinement: strict

architectures:
  - build-on: amd64
    build-for: amd64
  - build-on: arm64
    build-for: arm64

apps:
  datadog-cli:
    command: dd
    plugs:
      - home
      - network
      - network-bind

parts:
  datadog-cli:
    plugin: go
    source: .
    source-type: git
    build-snaps:
      - go/1.22/stable
    build-packages:
      - git
    override-build: |
      # Build the binary
      go build -ldflags="-s -w" -trimpath -o $SNAPCRAFT_PART_INSTALL/dd ./cmd/dd
    stage:
      - dd
    prime:
      - dd

# Snap-specific metadata
license: Apache-2.0
website: https://github.com/yourusername/datadog-cli-go
source-code: https://github.com/yourusername/datadog-cli-go
issues: https://github.com/yourusername/datadog-cli-go/issues
